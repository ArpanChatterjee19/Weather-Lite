<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWeatherApp-Lite</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <div class="card">
        <header class="head">MyWeatherApp-Lite</header>
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false">
            <button><img src="images/search.png"></button>
        </div>
        <div class="error">
            <p>Please enter a valid city name</p>
            <img src="/images/404.png" alt="404 Error">
            <p>Oops! Location not found</p>
        </div>
        <div class="weather">
            <img src="" class="weather-icon">
            <h1 class="temp"></h1>
            <p class="weatherSummary"></p>
            <h2 class="city"></h2>
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png">
                    <div>
                        <p class="humidity"></p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png">
                    <div>
                        <p class="wind"></p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
        <footer class = "foot">©Arpan Chatterjee</footer>
    </div>
    <script src="App.js"></script>
</body>

</html>
